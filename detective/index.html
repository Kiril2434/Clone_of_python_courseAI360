<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#e3d7bb">
<title>Дело о двухколёсном экипаже</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ruslan+Display&family=Oswald:wght@400;600&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;600&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
/* =========================================================================
   ПАПКА СЛЕДОВАТЕЛЯ. Один свет, намеренно: дело выглядит делом на любом фоне.
   ========================================================================= */
:root{
  --manila:#e3d7bb; --manila-d:#cdbe9c; --sheet:#f4eddc; --sheet-2:#eee5d0;
  --ink:#1b1815; --ink-2:#463f36; --ink-3:#6d6355;
  --stamp:#b4271e; --pencil:#2e4a6b; --kraft:#b99f6e; --tape:#d8c894;
  --rule:#c9b894;
  --shadow:0 1px 0 #fff6, 0 10px 22px rgba(40,30,15,.22);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:#8a7550;color:var(--ink);
  font-family:"IBM Plex Serif",Georgia,serif;font-size:17px;line-height:1.62;
  overscroll-behavior-y:none;
  background-image:
    repeating-linear-gradient(97deg,rgba(0,0,0,.05) 0 2px,transparent 2px 7px),
    radial-gradient(120% 80% at 50% 0,#9c8560,#6f5c3c 70%,#5b4a2f);
  background-attachment:fixed;
}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left}
:focus-visible{outline:3px solid var(--pencil);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.display{font-family:"Ruslan Display",Impact,serif}
.poster{font-family:Oswald,"Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.06em}
.type{font-family:"IBM Plex Mono",ui-monospace,monospace}
.hand{font-family:Caveat,"Segoe Script",cursive}

#app{max-width:640px;margin:0 auto;padding:0 0 92px;position:relative}

/* ---------- бумага и её шероховатый край ---------- */
.paper{position:relative;background:var(--sheet);box-shadow:var(--shadow);
  background-image:
    radial-gradient(circle at 18% 12%,rgba(160,130,80,.10),transparent 42%),
    radial-gradient(circle at 82% 88%,rgba(140,110,60,.09),transparent 46%);}
.paper:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.45;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.3'/></svg>")}
.torn{clip-path:polygon(0 6px,3% 2px,8% 7px,14% 1px,21% 6px,29% 2px,37% 7px,45% 2px,54% 6px,62% 1px,70% 6px,78% 2px,86% 7px,93% 2px,100% 6px,100% calc(100% - 5px),94% 100%,86% calc(100% - 5px),77% 100%,68% calc(100% - 4px),58% 100%,48% calc(100% - 5px),38% 100%,28% calc(100% - 4px),18% 100%,9% calc(100% - 5px),0 100%)}

/* ---------- шапка: язычок папки ---------- */
.top{position:sticky;top:0;z-index:40}
.tab{max-width:640px;margin:0 auto;background:var(--manila);
  border-bottom:2px solid #00000022;padding:9px 16px 8px;
  padding-top:calc(9px + env(safe-area-inset-top));
  display:flex;align-items:center;gap:12px;
  box-shadow:0 6px 14px rgba(40,30,15,.3);
  background-image:repeating-linear-gradient(91deg,rgba(0,0,0,.028) 0 1px,transparent 1px 5px)}
.tab .case{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.16em;
  color:var(--ink-3);text-transform:uppercase}
.tab .dayname{font-family:Oswald,sans-serif;text-transform:uppercase;letter-spacing:.03em;
  font-size:19px;line-height:1.05;color:var(--ink);font-weight:600}
.tally{margin-left:auto;display:flex;gap:4px;align-items:flex-end}
.tally i{display:block;width:6px;height:19px;background:var(--ink);transform:rotate(-7deg);border-radius:1px}
.tally i.gone{background:none;border-left:2px dotted #9d907c;height:15px}
.tab .hrs{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-3);
  letter-spacing:.1em;margin-left:6px;align-self:center}

/* ---------- лист сцены ---------- */
.wrap{padding:16px 12px}
.sheet-card{position:relative;margin-bottom:18px}
.sheet-card .paper{padding:0 0 4px}
.hdr{padding:16px 20px 0}
.hdr .where{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.17em;
  text-transform:uppercase;color:var(--stamp)}
.hdr h2{font-family:Oswald,sans-serif;text-transform:uppercase;font-weight:600;letter-spacing:.01em;
  margin:3px 0 0;font-size:clamp(25px,7.2vw,33px);line-height:1.02;text-wrap:balance}
.hdr .rule{height:2px;background:var(--ink);margin:12px 0 0;opacity:.85}
.hdr .rule+.rule{margin-top:2px;height:1px;opacity:.45}

/* вклеенный рисунок */
.plate{margin:20px 18px 4px;position:relative;transform:rotate(-.9deg)}
.plate .in{position:relative;background:#fbf6e9;padding:7px 7px 0;
  box-shadow:0 2px 0 #0000000d,0 9px 18px rgba(40,30,15,.26);overflow:hidden}
.plate svg,.plate img{width:100%;display:block}
.plate img.ph{position:absolute;left:7px;right:7px;top:7px;width:calc(100% - 14px);
  opacity:0;transition:opacity .7s;mix-blend-mode:multiply;filter:sepia(.5) contrast(1.05)}
.plate .cap{font-family:Caveat,cursive;font-size:19px;color:var(--pencil);
  padding:5px 8px 8px;line-height:1.15}
.plate:after,.plate:before{content:"";position:absolute;width:64px;height:22px;background:rgba(216,200,148,.72);
  border-left:1px solid #0000000f;border-right:1px solid #0000000f;box-shadow:0 1px 3px #0002}
.plate:before{top:-10px;left:-14px;transform:rotate(-24deg)}
.plate:after{bottom:16px;right:-16px;transform:rotate(-19deg)}

/* текст */
.body{padding:16px 20px 8px}
.body p{margin:0 0 15px;max-width:62ch}
.body p.q{font-family:"IBM Plex Mono",monospace;font-size:14.5px;line-height:1.6;
  border-left:2px solid var(--stamp);padding:2px 0 2px 13px;margin-left:2px;color:var(--ink-2)}
.body p.q .who{display:block;font-family:Oswald,sans-serif;text-transform:uppercase;
  letter-spacing:.08em;font-size:12.5px;color:var(--ink);font-weight:600;margin-bottom:3px}
.body p.note{font-family:Caveat,cursive;font-size:21px;line-height:1.32;color:var(--pencil);
  border-top:1px dashed #bfae8c;padding-top:8px;transform:rotate(-.35deg)}

/* ---------- выборы: полоски-действия ---------- */
.choices{padding:6px 16px 20px;display:flex;flex-direction:column;gap:9px}
.ch{position:relative;background:var(--sheet-2);border:1.5px solid var(--ink);
  padding:11px 13px 11px 40px;display:block;box-shadow:2px 2px 0 var(--ink);transition:.12s}
.ch:before{content:"";position:absolute;left:13px;top:13px;width:14px;height:14px;
  border:1.5px solid var(--ink)}
.ch:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.ch .txt{font-family:Oswald,sans-serif;text-transform:uppercase;letter-spacing:.02em;
  font-size:15px;font-weight:400;line-height:1.25;display:block}
.ch small{display:block;font-family:"IBM Plex Serif",serif;text-transform:none;letter-spacing:0;
  font-size:13.5px;color:var(--ink-3);margin-top:4px;line-height:1.4}
.ch .cost{position:absolute;right:9px;top:8px;font-family:"IBM Plex Mono",monospace;
  font-size:10px;color:var(--stamp);border:1px solid var(--stamp);padding:0 4px;transform:rotate(2deg)}
.ch.ev{background:#f6e9cf;border-style:double;border-width:3px}
.ch.ev:before{background:var(--stamp);border-color:var(--stamp)}
.ch.locked{opacity:.5;box-shadow:none;border-style:dashed}
.ch.locked:before{border-style:dashed}

/* ---------- список дня ---------- */
.plan{padding:20px 20px 6px}
.plan .kick{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--stamp)}
.plan h2{font-family:Oswald,sans-serif;text-transform:uppercase;font-weight:600;
  margin:4px 0 6px;font-size:clamp(26px,7.6vw,34px);line-height:1;text-wrap:balance}
.plan .sub{font-size:15.5px;color:var(--ink-2);max-width:56ch}
.locs{padding:12px 16px 18px;display:flex;flex-direction:column;gap:8px}
.loc{position:relative;display:flex;gap:12px;align-items:flex-start;padding:11px 12px 11px 12px;
  background:var(--sheet-2);border-bottom:1px solid var(--rule);width:100%}
.loc .no{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-3);padding-top:2px}
.loc b{display:block;font-family:Oswald,sans-serif;text-transform:uppercase;font-weight:600;
  font-size:16.5px;letter-spacing:.01em;line-height:1.15}
.loc span{display:block;font-size:14px;color:var(--ink-3);line-height:1.4;margin-top:2px}
.loc .mark{margin-left:auto;font-family:Oswald,sans-serif;font-size:10.5px;letter-spacing:.1em;
  color:var(--ink-3);border:1px solid var(--rule);padding:1px 5px;white-space:nowrap;align-self:center}
.loc.spent{opacity:.62}
.loc.spent .mark{color:var(--stamp);border-color:var(--stamp);transform:rotate(-3deg)}
.loc.spent b{text-decoration:line-through;text-decoration-thickness:1.5px}

/* ---------- штамп-кнопка ---------- */
.stampbtn{display:block;width:100%;text-align:center;font-family:Oswald,sans-serif;
  text-transform:uppercase;letter-spacing:.14em;font-weight:600;font-size:17px;
  color:var(--stamp);border:3px double var(--stamp);padding:13px;background:#0000;
  transform:rotate(-.7deg);margin:6px 0 12px}
.stampbtn.ink{color:var(--ink);border-color:var(--ink)}
.stampbtn:active{transform:rotate(-.7deg) scale(.985)}

/* ---------- нижняя панель: корешки ---------- */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:60;background:var(--manila);
  border-top:2px solid #00000026;padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -6px 16px rgba(40,30,15,.28)}
.nav-in{display:flex;max-width:640px;margin:0 auto}
.nav button{flex:1;padding:10px 2px 9px;font-family:Oswald,sans-serif;text-transform:uppercase;
  letter-spacing:.09em;font-size:11px;color:var(--ink-3);text-align:center;
  border-right:1px solid #00000018}
.nav button:last-child{border-right:none}
.nav button.on{color:var(--stamp);box-shadow:inset 0 -3px 0 var(--stamp)}

/* ---------- всплывающие листы ---------- */
.sheet{position:fixed;inset:0;z-index:80;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:#6f5c3ce6;backdrop-filter:blur(3px);animation:sin .22s ease-out}
@keyframes sin{from{opacity:0;transform:translateY(14px)}}
.sheet-in{max-width:640px;margin:0 auto;padding:0 12px calc(96px + env(safe-area-inset-bottom))}
.sheet-h{position:sticky;top:0;z-index:3;background:var(--manila);margin:0 -12px 14px;
  padding:calc(12px + env(safe-area-inset-top)) 18px 11px;display:flex;align-items:center;gap:10px;
  border-bottom:2px solid #00000022}
.sheet-h h2{font-family:Oswald,sans-serif;text-transform:uppercase;font-weight:600;margin:0;
  font-size:22px;letter-spacing:.04em}
.sheet-h .x{margin-left:auto;font-family:Oswald,sans-serif;font-size:15px;color:var(--stamp);
  border:1.5px solid var(--stamp);padding:1px 8px}

/* карточка улики */
.evi{position:relative;background:var(--sheet);padding:13px 15px 15px;margin-bottom:12px;
  box-shadow:var(--shadow);
  background-image:repeating-linear-gradient(180deg,transparent 0 27px,#c9b8941f 27px 28px)}
.evi:nth-child(odd){transform:rotate(.5deg)}
.evi:nth-child(even){transform:rotate(-.6deg)}
.evi b{display:block;font-family:Oswald,sans-serif;text-transform:uppercase;font-weight:600;
  font-size:17px;line-height:1.12;padding-right:26px}
.evi p{margin:5px 0 0;font-size:15px;color:var(--ink-2)}
.evi .tag{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);border:1px solid var(--rule);
  padding:1px 6px;margin:9px 5px 0 0}
.evi .pin{position:absolute;right:12px;top:11px;width:11px;height:11px;border-radius:50%;
  background:var(--stamp);box-shadow:0 2px 4px #0004,inset -2px -2px 0 #0003}
.evi.new{padding-bottom:34px}
.evi.new:after{content:"подшито сегодня";position:absolute;right:10px;bottom:8px;font-family:Oswald,sans-serif;
  font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--stamp);
  border:1.5px solid var(--stamp);padding:1px 7px;transform:rotate(-3deg);background:var(--sheet)}
.evi.unknown{background:var(--sheet-2);opacity:.72}

/* версия */
.ver{background:var(--sheet);padding:13px 15px;margin-bottom:11px;box-shadow:var(--shadow)}
.ver .vh{display:flex;align-items:baseline;gap:9px}
.ver b{font-family:Oswald,sans-serif;text-transform:uppercase;font-weight:600;font-size:17.5px}
.ver .pct{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:13px;
  font-variant-numeric:tabular-nums;color:var(--stamp)}
.gauge{height:14px;margin:9px 0 8px;border:1.5px solid var(--ink);position:relative;background:#0000}
.gauge i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--ink) 0 3px,transparent 3px 6px);
  transition:width .6s}
.ver p{margin:0;font-size:14.5px;color:var(--ink-2)}
.ver.dead{opacity:.5}
.ver.dead b{text-decoration:line-through}

/* ---------- обложка дела ---------- */
.cover{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:16px 12px;
  padding-top:calc(16px + env(safe-area-inset-top))}
.folder{background:var(--manila);padding:26px 22px 24px;box-shadow:0 20px 44px rgba(30,20,8,.45);
  background-image:repeating-linear-gradient(91deg,rgba(0,0,0,.03) 0 1px,transparent 1px 6px);
  border-top:14px solid #d3c4a2;position:relative}
.folder .no{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.2em;color:var(--ink-3);
  text-transform:uppercase}
.folder h1{font-family:"Ruslan Display",Impact,serif;font-size:clamp(33px,10.5vw,54px);line-height:.94;
  margin:12px 0 4px;letter-spacing:-.01em;text-wrap:balance}
.folder h1 em{font-style:normal;color:var(--stamp)}
.folder .lede{font-size:16px;color:var(--ink-2);margin:14px 0 0;max-width:48ch}
.folder .meta{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;margin:18px 0 0;
  font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink-2)}
.folder .meta dt{color:var(--ink-3);text-transform:uppercase;letter-spacing:.09em;font-size:10.5px;padding-top:3px}
.folder .meta dd{margin:0}
.age{position:absolute;right:14px;top:-6px;font-family:Oswald,sans-serif;font-weight:600;font-size:16px;
  letter-spacing:.1em;color:var(--stamp);border:3px double var(--stamp);padding:5px 9px;
  transform:rotate(9deg);background:#e3d7bbcc}
.cover .after{margin-top:16px;padding:16px 18px}
.cover .after h3{font-family:Oswald,sans-serif;text-transform:uppercase;letter-spacing:.1em;
  font-size:12.5px;margin:0 0 8px;color:var(--stamp)}
.cover .after p{margin:0 0 10px;font-size:15px;color:var(--ink-2)}
.cover .after p:last-child{margin-bottom:0}

/* ---------- развязка ---------- */
.verdict{padding:24px 20px 26px}
.verdict .band{font-family:Oswald,sans-serif;text-transform:uppercase;letter-spacing:.16em;
  font-size:12px;color:var(--stamp)}
.verdict h1{font-family:"Ruslan Display",Impact,serif;font-size:clamp(30px,9vw,46px);line-height:.98;
  margin:8px 0 16px;text-wrap:balance}
.verdict .txt p{margin:0 0 15px;max-width:62ch}
.ledger{margin:18px 0 0;border-top:2px solid var(--ink)}
.ledger div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;
  border-bottom:1px solid var(--rule);font-family:"IBM Plex Mono",monospace;font-size:13px}
.ledger span:last-child{color:var(--stamp);text-align:right}
.afterword{font-size:14.5px;color:var(--ink-2);border-left:3px solid var(--kraft);padding-left:13px;margin-top:18px}
.bigstamp{display:inline-block;font-family:Oswald,sans-serif;font-weight:600;letter-spacing:.14em;
  color:var(--stamp);border:4px double var(--stamp);padding:8px 14px;transform:rotate(-5deg);
  font-size:19px;margin:4px 0 14px;text-transform:uppercase}
.bigstamp.grey{color:var(--ink-3);border-color:var(--ink-3)}

/* ---------- уведомление об улике ---------- */
#toasts{position:fixed;left:0;right:0;bottom:calc(70px + env(safe-area-inset-bottom));z-index:90;
  display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px}
.toast{background:var(--sheet);max-width:520px;width:100%;padding:11px 14px;
  border-left:5px solid var(--stamp);box-shadow:0 12px 26px rgba(30,20,8,.45);
  transform:rotate(-.6deg);animation:tin .3s}
.toast b{display:block;font-family:Oswald,sans-serif;text-transform:uppercase;font-size:14px;letter-spacing:.05em}
.toast p{margin:2px 0 0;font-size:13.5px;color:var(--ink-2);line-height:1.4}
@keyframes tin{from{opacity:0;transform:translateY(12px) rotate(-.6deg)}}
.fade{animation:fu .35s}
@keyframes fu{from{opacity:0;transform:translateY(9px)}}
.mini{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-3)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts"></div>
<div class="nav" id="nav" style="display:none"><div class="nav-in"><button data-n="hub">Дело</button><button data-n="evi">Улики</button><button data-n="ver">Версии</button><button data-n="who">Лица</button><button data-n="menu">Ещё</button></div></div>
<script>
"use strict";
/* =========================================================================
   ТАЙНА ДВУХКОЛЁСНОГО ЭКИПАЖА
   Интерактивное расследование по роману Фергюса Хьюма (1886, общественное
   достояние). Текст, механики, развилки и концовки написаны для этой игры.
   ========================================================================= */

/* ---------- РИСОВКА ------------------------------------------------------
   Иллюстрации рисуются пером: дрожащая линия, штриховка, одно красное пятно
   на кадр. Зерно детерминировано мотивом — рисунок не пляшет при перерисовке. */
function seed(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}
  return function(){h+=0x6D2B79F5;let t=h;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);
    return ((t^t>>>14)>>>0)/4294967296}}
const INK='#1b1815', RED='#b4271e';

/* дрожащая линия по опорным точкам */
function pen(pts,rnd,amp){
  amp=amp||1.15;let d='';
  for(let i=0;i<pts.length;i++){
    const[x,y]=pts[i], jx=x+(rnd()-.5)*amp, jy=y+(rnd()-.5)*amp;
    if(!i){d+='M'+jx.toFixed(1)+' '+jy.toFixed(1)}
    else{const[px,py]=pts[i-1], cx=(px+x)/2+(rnd()-.5)*amp*2.4, cy=(py+y)/2+(rnd()-.5)*amp*2.4;
      d+='Q'+cx.toFixed(1)+' '+cy.toFixed(1)+' '+jx.toFixed(1)+' '+jy.toFixed(1)}}
  return d;
}
function stroke(pts,rnd,w,amp,close){
  return '<path d="'+pen(pts,rnd,amp)+(close?'z':'')+'" fill="none" stroke="'+INK+
    '" stroke-width="'+(w||1.6)+'" stroke-linecap="round" stroke-linejoin="round"/>';
}
function fill(pts,rnd,c,amp){return '<path d="'+pen(pts,rnd,amp||.9)+'z" fill="'+(c||INK)+'"/>';}
/* штриховка внутри прямоугольника */
function hatch(x,y,w,h,gap,rnd,ang,op){
  let o='',n=Math.ceil((w+h)/gap);const id='c'+Math.floor(rnd()*1e6);
  for(let i=0;i<n;i++){const off=i*gap-h;
    o+=stroke(ang<0?[[x+off,y+h],[x+off+h,y]]:[[x+off,y],[x+off+h,y+h]],rnd,.85,1.1);}
  return '<clipPath id="'+id+'"><rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'"/></clipPath>'+
    '<g clip-path="url(#'+id+')" opacity="'+(op||.5)+'">'+o+'</g>';
}
/* фигура человека в шляпе и пальто */
function man(x,y,s,rnd,red){
  const g=(a,b)=>[x+a*s,y+b*s];
  return '<g>'+
   fill([g(-7,-34),g(7,-34),g(8,-30),g(-8,-30)],rnd)+            /* поля шляпы */
   fill([g(-5,-44),g(5,-44),g(5,-34),g(-5,-34)],rnd)+            /* тулья */
   stroke([g(-6,-30),g(-4,-24),g(4,-24),g(6,-30)],rnd,1.5)+      /* лицо-тень */
   fill([g(-11,-24),g(11,-24),g(13,6),g(-13,6)],rnd)+            /* пальто */
   stroke([g(0,-22),g(0,4)],rnd,1)+
   stroke([g(-13,6),g(-10,26)],rnd,2)+stroke([g(13,6),g(10,26)],rnd,2)+
   (red?'<path d="'+pen([g(-7,-25),g(0,-21),g(7,-25)],rnd,1)+'" fill="none" stroke="'+RED+'" stroke-width="3.4" stroke-linecap="round"/>':'')+
   '</g>';
}
function lamp(x,g,rnd){
  return stroke([[x,236],[x,236-g]],rnd,2.4)+
   fill([[x-8,236-g],[x+8,236-g],[x+6,236-g-16],[x-6,236-g-16]],rnd)+
   '<circle cx="'+x+'" cy="'+(236-g-9)+'" r="4.5" fill="#f6efdd" stroke="'+INK+'" stroke-width="1.2"/>'+
   stroke([[x-9,236-g-16],[x,236-g-25],[x+9,236-g-16]],rnd,1.6);
}

    {who:'Мэдж Фретлби',q:'Мой жених не убивал. Я говорю это не как влюблённая дура, а как человек, который видел его лицо, когда принесли газету. Он не был испуган. Он был раздавлен.'},
    'Она колеблется — и всё-таки достаёт из бювара сложенный вдвое листок.',
    {who:'Мэдж Фретлби',q:'Я писала это подруге и не отправила. Прочтите. И запомните: если вы обратите это против моего отца, я вам этого не прощу.'}],
 ch:[
  {x:'Взять записку',ev:['e_madge_letter'],set:{madge_trust:1},go:'d2_madge2'},
  {x:'Отказаться: «Не хочу вас использовать»',set:{madge_trust:2},sub:'Она запомнит. И позовёт вас сама',go:'d2_madge2'}]},
d2_madge2:{loc:'Тураки',ttl:'Отец, который не спит',motif:'mansion',pal:'dawn',
 t:[{who:'Мэдж Фретлби',q:'С весны отец сам не свой. Он дал этому человеку денег — отец, который не даёт денег никому, даже церкви. А потом стал запирать кабинет.'},
    'На лестнице вы сталкиваетесь с самим Фретлби. Он смотрит на вас ровно секунду дольше, чем нужно, и проходит мимо.',
    {note:'Хозяин дома знает, зачем вы здесь. И уже решил, что скажет.'}],
 ch:[{x:'Уйти',go:'HUB',ev:['e_whyte_blackmail']}]},

d2_calton:{loc:'Контора Калтона',ttl:'Сделка с защитой',motif:'room',pal:'gas',
 t:['Адвокат Дункан Калтон встречает вас без враждебности — редкость для человека, чьего клиента вы собираетесь повесить.',
    {who:'Калтон',q:'Мой клиент молчит, ваш начальник спешит. Меня не устраивает ни то, ни другое. Предлагаю обмен: я отдаю вам всё, что нарою, вы мне — то, что Горби положит под сукно.'}],
 ch:[
  {x:'Согласиться на обмен',ev:['e_brian_silence','e_kilsip'],set:{calton:1},
   sub:'Нарушение порядка. И единственный способ работать',go:'d2_calton2'},
  {x:'Отказаться, но выслушать',ev:['e_brian_silence'],go:'d2_calton2'}]},
d2_calton2:{loc:'Контора Калтона',ttl:'Тот, кто знает переулки',motif:'room',pal:'gas',
 t:[{who:'Калтон',q:'Возьмите с собой Килсипа. Горби держит его на побегушках, а он знает Литтл-Бурк-стрит лучше, чем вы — собственный карман. И он терпеть не может скорых приговоров.'},
    {who:'Калтон',q:'И ещё, следователь. Спросите себя, зачем убийце понадобилось возвращаться. За бумажником, полным банкнот? Он не тронул часов.'}],
 ch:[{x:'Уйти',go:'HUB'}]},

d2_gorby:{loc:'Кабинет инспектора',ttl:'Готовый вывод',motif:'room',pal:'blood',
 t:['На столе — папка, на папке — фамилия. Ваша подпись нужна для симметрии.',
    {who:'Инспектор Горби',q:'Ревность, угроза, пальто. Три гвоздя, больше и не нужно. Подписывайте, и к среде вы свободны для новых дел.'}],
 ch:[
  {x:'Подписать',set:{signed:1},sub:'Горби перестанет мешать. И перестанет вас слушать',go:'d2_gorby2'},
  {x:'Отказаться подписывать',set:{signed:0,defied:1},sub:'Вы теряете людей и получаете срок в пять дней',go:'d2_gorby2'},
  {x:'Потребовать проверить хлороформ',c:1,need:'e_chloro_smell',ev:['e_gorby_pressure'],set:{defied:1},
   sub:'Прямое столкновение с начальником',go:'d2_gorby3'}]},
d2_gorby2:{loc:'Кабинет инспектора',ttl:'Служба',motif:'room',pal:'blood',
 t:['Горби смотрит на вас так, как смотрят на молодого врача, объясняющего старому анатому строение руки.',
    {who:'Инспектор Горби',q:'Ещё раз пойдёте в переулок — сдадите жетон. Город хочет виновного к среде, а не истины к Рождеству.'}],
 ch:[{x:'Выйти',go:'HUB',ev:['e_gorby_pressure']}]},
d2_gorby3:{loc:'Кабинет инспектора',ttl:'Аптечная тряпка',motif:'room',pal:'blood',
 t:['Вы выкладываете заключение Чинстона. Хлороформ. Купленный заранее, принесённый с собой, применённый терпеливо.',
    {who:'Инспектор Горби',q:'И что? Ревнивец тоже умеет ходить в аптеку.'},
    {who:'Вы',q:'Ревнивец не покупает хлороформ за неделю до ссоры, инспектор. Ревнивец бьёт.'},
    'Он не отвечает. Но папку со стола убирает.'],
 ch:[{x:'Выйти',go:'HUB',ev:['e_gorby_pressure']}]},

d2_footman:{loc:'Служебный вход клуба',ttl:'Дословно',motif:'pub',pal:'gas',
 t:['Лакей повторяет угрозу с удовольствием актёра, нашедшего свою роль.',
    {who:'Лакей',q:'«Если ты произнесёшь при ней хоть слово, я тебя убью». Так и сказал, сэр. А мистер Уайт засмеялся и говорит: «Произнесу, и не одно».'},
    'Вы просите вспомнить, был ли кто-то ещё в комнате.',
    {who:'Лакей',q:'Был. Приятель мистера Уайта, тихий такой, у камина. Он всё слышал. И, знаете, улыбался.'}],
 ch:[
  {x:'Записать имя приятеля',ev:['e_brian_quarrel','e_moreland_name'],go:'d2_foot2'},
  {x:'Спросить, о чём была угроза',ev:['e_brian_quarrel'],go:'d2_foot2'}]},
d2_foot2:{loc:'Служебный вход клуба',ttl:'Третий в комнате',motif:'pub',pal:'gas',
 t:['В комнате их было не двое, а трое. И третий узнал сразу две вещи: что у Уайта есть тайна, стоящая денег, и что за эту тайну уже пообещали убить.',
    {note:'Идеальное положение: чужой мотив, чужая угроза, чужое имя в газетах.'}],
 ch:[{x:'Дальше',go:'HUB'}]},

d2_end:{loc:'Ночь над городом',ttl:'Вторая ночь',motif:'gas',pal:'night',
 t:['Умирающая женщина, которой Фицджеральд не назовёт имени. Тихий приятель, улыбавшийся у камина. Пустая шкатулка.',
    'Три нити, и все три уходят в один переулок.'],
 ch:[{x:'Закончить день',go:'NEXTDAY'}]},

/* ============================ ДЕНЬ 3 ============================ */
d3_intro:{loc:'Угол Бурк-стрит',ttl:'Двадцать шагов от закона',motif:'slum',pal:'night',
 t:['Килсип ждёт вас на углу, без формы, с фонарём под полой.',
    {who:'Килсип',q:'Держитесь правой стороны и не давайте никому в руки денег на виду. Здесь не грабят следователей — здесь просто перестают вас видеть.'},
    'Литтл-Бурк-стрит начинается сразу за фонарным столбом. Газа тут нет. Есть керосин, джин и очень много людей на очень малом пространстве.'],
 ch:[{x:'Войти',go:'HUB',ev:['e_kilsip']}]},

d3_lane:{loc:'Литтл-Бурк-стрит',ttl:'Переулок',motif:'slum',pal:'night',
 t:['Женщины в дверных проёмах провожают вас взглядом, в котором нет ни страха, ни интереса. Ребёнок лет семи торгует спичками и знает цену каждому проходящему.',
    {who:'Килсип',q:'Здесь никто не соврёт вам в лицо. Здесь просто скажут, что не помнят. Помнить — дорого.'},
    'Джентльмена в вечернем платье тут запомнили бы навсегда. И действительно запомнили.'],
 ch:[
  {x:'Показать портрет Фицджеральда',ev:['e_rosanna'],sub:'Кто-то видел его здесь в ночь убийства',go:'d3_lane2'},
  {x:'Расспросить о «даме сверху»',ev:['e_rosanna','e_sal'],c:1,go:'d3_lane2'}]},
d3_lane2:{loc:'Литтл-Бурк-стрит',ttl:'Дама сверху',motif:'slum',pal:'night',
 t:['Молодого джентльмена помнят: приходил ночью, поднимался в мансанду к «даме сверху», вышел под утро — белый как мел.',
    {who:'Килсип',q:'«Дама сверху» — это Розанна Мур. Двадцать лет назад ей аплодировал весь порт. Сейчас она кашляет кровью и не платит за угол уже месяц.'}],
 ch:[{x:'Дальше',go:'HUB'}]},

d3_granny:{loc:'Дом старухи Роулинс',ttl:'Джин и чужие тайны',motif:'slum',pal:'gas',
 t:['Старуха Роулинс держит комнаты, торгует джином и разговаривает только за деньги.',
    {who:'Старуха Роулинс',q:'Померла бы она давно, кабы не Сэл. Девка при ней день и ночь, воды подаст, простыню сменит. И ведь не родня, а ходит.'},
    'На вопрос о ночи убийства старуха вдруг трезвеет.',
    {who:'Старуха Роулинс',q:'В ту ночь Сэл убегала. Часа в одиннадцать. Вернулась к рассвету, вся мокрая, и ни слова. Я не спрашивала. Тут не спрашивают.'}],
 ch:[
  {x:'Заплатить за разговор',ev:['e_sal'],set:{paid:1},go:'d3_granny2'},
  {x:'Пригрозить закрыть притон',c:1,ev:['e_sal','e_letter_torn'],set:{harsh:1},go:'d3_granny2'},
  {x:'Спросить о родне Сэл',need:'e_rosanna',ev:['e_sal','e_heir'],sub:'Опасный вопрос — старуха знает больше, чем говорит',go:'d3_granny3'}]},
d3_granny2:{loc:'Дом старухи Роулинс',ttl:'Девка, которая ходит',motif:'slum',pal:'gas',
 t:['Сэл Роулинс убегала в ночь убийства и вернулась под утро. То же самое сделал и Фицджеральд.',
    {note:'Или они виделись — или один из них лжёт.'}],
 ch:[{x:'Дальше',go:'HUB'}]},
d3_granny3:{loc:'Дом старухи Роулинс',ttl:'Не внучка',motif:'slum',pal:'gas',
 t:['Старуха долго молчит, потом наливает себе, не вам.',
    {who:'Старуха Роулинс',q:'Сэл мне не внучка. Мне её принесли младенцем и заплатили, чтоб я забыла, кто принёс. Двадцать лет платили, потом перестали. А я не забыла.'},
    {note:'Ребёнок, которого спрятали за деньги. Двадцать лет назад.'}],
 ch:[{x:'Дальше',go:'HUB'}]},

d3_garret:{loc:'Мансарда без окна',ttl:'Женщина, которой осталось немного',motif:'room',pal:'cold',
 t:['Комната под самой крышей: свеча, таз, запах карболки и болезни. Розанна Мур приподнимается на локте и смотрит на вас с насмешкой человека, которому уже нечего терять.',
    {who:'Розанна Мур',q:'Полиция. Наконец-то. Я ждала вас раньше, чем смерть, но она оказалась расторопнее.'},
    {who:'Розанна Мур',q:'Я отдала ему бумагу. Оливеру. Красивому мальчику с пустыми глазами. Я велела ему получить с одного господина всё, что тот мне должен за двадцать лет. Мальчик решил взять больше — и вот он в морге, а я в этой дыре.'}],
 ch:[
  {x:'«Что за бумага?»',ev:['e_rosanna','e_whyte_blackmail'],go:'d3_garret2'},
  {x:'«Кто этот господин?»',c:1,ev:['e_rosanna','e_certificate'],sub:'Она скажет имя, если вы дадите слово',set:{promise:1},go:'d3_garret3'},
  {x:'Сначала позвать доктора за свой счёт',c:1,ev:['e_rosanna','e_sal','e_heir'],
   sub:'Она этого не забудет. И расскажет о ребёнке',set:{kind:1},go:'d3_garret3'}]},
d3_garret2:{loc:'Мансарда',ttl:'Бумага',motif:'room',pal:'cold',
 t:[{who:'Розанна Мур',q:'Бумага, после которой у одной очень богатой барышни не останется ни имени, ни фартинга. Больше не скажу. Мне нечем расплатиться за похороны, кроме этой тайны.'},
    'Она заходится кашлем. Килсип у двери качает головой: два-три дня, не больше.'],
 ch:[{x:'Уйти',go:'HUB'}]},
d3_garret3:{loc:'Мансарда',ttl:'Двадцать лет назад',motif:'room',pal:'cold',
 t:[{who:'Розанна Мур',q:'Марк Фретлби. Ваш столп общества, ваш благотворитель, ваш «шерстяной король». Он венчался со мной в приходе Святого Килды, когда у него не было ни овцы, ни имени.'},
    {who:'Розанна Мур',q:'Потом он встретил другую — с приданым. Мою девочку объявили мёртвой и отдали за деньги старухе в переулок. А я подписала бумагу, что уеду. Я уехала. Но я не умерла, слышите? Он женился при живой жене.'},
    {note:'Если это правда: второй брак Фретлби недействителен, Мэдж — незаконнорождённая и без наследства, а законная наследница всего состояния сейчас носит воду в этой самой комнате.'}],
 ch:[{x:'Уйти',go:'HUB',ev:['e_certificate','e_heir']}]},

d3_anchor:{loc:'Трактир «Якорь»',ttl:'Последний вечер Уайта',motif:'pub',pal:'gas',
 t:['Половой узнаёт покойного по карточке сразу — такие гости в «Якоре» редкость.',
    {who:'Половой',q:'Пили до полуночи, сэр, вдвоём. Ваш красавец куражился: «Завтра, — говорит, — я буду богаче любого из вас». Приятель ему всё подливал и подливал.'},
    {who:'Половой',q:'Ушли вместе. А приятель через час вернулся — один, за своей шляпой. И трезвый был, сэр. Совсем трезвый.'}],
 ch:[
  {x:'Уточнить, кто платил',ev:['e_pub_witness'],go:'d3_anchor2'},
  {x:'Спросить про верхнюю одежду',c:1,ev:['e_pub_witness','e_coat_swap'],
   sub:'Половой помнит, кто в чём уходил',go:'d3_anchor2'}]},
d3_anchor2:{loc:'Трактир «Якорь»',ttl:'Чужое пальто',motif:'pub',pal:'gas',
 t:[{who:'Половой',q:'Так они и пальто перепутали, шутки ради. Ваш красавец в тёмном ушёл, а приятель в его светлом да в белом кашне. Смеялись оба.'},
    {note:'Кэбмен видел светлое пальто и белое кашне. Он видел не владельца пальто.'}],
 ch:[{x:'Дальше',go:'HUB'}]},

d3_sal:{loc:'Переулки',ttl:'Поиски Сэл Роулинс',motif:'slum',pal:'night',
 t:['Сэл исчезла из переулка. Килсип проверяет ночлежки, притоны и больницу для бедных.',
    {who:'Килсип',q:'Её ищем не мы одни. Утром о ней спрашивал господин в новом костюме. Не из полиции. Хорошо одет, весел и очень щедр на вопросы.'},
    'Господин в новом костюме. В городе, где половина мужчин донашивает прошлогоднее.'],
 ch:[
  {x:'Продолжать поиски всю ночь',c:2,ev:['e_alibi','e_sal'],sub:'Дорого по времени. Но алиби — это алиби',go:'d3_sal2'},
  {x:'Оставить поиски Килсипу',ev:['e_sal'],sub:'Он будет искать медленнее, но вы сбережёте день',set:{kilsip_search:1},go:'d3_sal3'}]},
d3_sal2:{loc:'Больница для бедных',ttl:'Свидетельница',motif:'church',pal:'dawn',
 t:['Вы находите её под утро, в коридоре больницы: девушка лет двадцати, босая, с несходящей настороженностью в глазах.',
    {who:'Сэл Роулинс',q:'Джентльмен? Был. Всю ночь у ней сидел, до самого света. Она ему всё рассказывала, а он на полу сидел и голову держал руками. Я в дверях стояла. Я всё видела.'},
    {note:'Алиби Фицджеральда существует. И оно уничтожает всё обвинение Горби.'}],
 ch:[{x:'Взять её под охрану',go:'HUB',ev:['e_alibi'],set:{sal_safe:1}}]},
d3_sal3:{loc:'Переулки',ttl:'Ускользнула',motif:'slum',pal:'night',
 t:['К утру Сэл не нашли. Килсип обещает продолжать — но у него свои дежурства и свой начальник.',
    {who:'Килсип',q:'Найду. Вопрос только — раньше или позже того господина в новом костюме.'}],
 ch:[{x:'Дальше',go:'HUB'}]},

d3_end:{loc:'Рассвет над переулком',ttl:'Третья ночь',motif:'slum',pal:'dawn',
 t:['Дело развернулось. Речь уже не о ревности: речь о двадцатилетней лжи, о подменённом ребёнке и о состоянии, которое принадлежит не тому, кто им владеет.',
    'Осталось понять, кто из знавших об этом держал платок у лица Оливера Уайта.'],
 ch:[{x:'Закончить день',go:'NEXTDAY'}]},

/* ============================ ДЕНЬ 4 ============================ */
d4_intro:{loc:'Участок',ttl:'Бумага, которой не существует',motif:'room',pal:'gas',
 t:['Шантаж всегда упирается в документ. Документа нет: шкатулка Уайта пуста, комната обыскана, карманы вывернуты.',
    'Значит, документ у убийцы. И значит, убийца — тот, кому этот документ нужен: чтобы уничтожить или чтобы продолжить.',
    {who:'Килсип',q:'Уничтожить — это Фретлби. Продолжить — это кто-то без гроша. Выбирайте, куда идти, сэр. На оба конца города дня не хватит.'}],
 ch:[{x:'Начать день',go:'HUB'}]},

d4_house:{loc:'Тураки, кабинет',ttl:'Приём у миллионера',motif:'mansion',pal:'dawn',
 t:['Марк Фретлби принимает вас у камина. Крупный, красивый, безупречно спокойный человек — и лицо цвета старой бумаги.',
    {who:'Марк Фретлби',q:'Я давал Уайту деньги. Много. Я не намерен объяснять, за что. Если хотите — считайте это благотворительностью с дурным вкусом.'},
    'На столе — стакан с каплями и открытая коробочка сердечных пилюль.'],
 ch:[
  {x:'Предъявить расписки',need:'e_frettlby_paid',ev:['e_whyte_blackmail'],go:'d4_house2'},
  {x:'Произнести имя: Розанна Мур',need:'e_rosanna',ev:['e_certificate'],set:{shock:1},go:'d4_house3'},
  {x:'Спросить прямо, где он был в ночь убийства',ev:['e_whyte_blackmail'],go:'d4_house2'}]},
d4_house2:{loc:'Тураки, кабинет',ttl:'Стена',motif:'mansion',pal:'dawn',
 t:[{who:'Марк Фретлби',q:'В ту ночь я был дома. Слуги подтвердят, потому что это правда. А теперь позвольте: у меня дела, а у вас, полагаю, тоже.'},
    'Он провожает вас до двери сам. Рука, которой он берётся за косяк, заметно дрожит.'],

/* =========================================================================
   ДВИЖОК
   ========================================================================= */
const app=document.getElementById('app'), nav=document.getElementById('nav');
let S=null, sheet=null, pendingAcc=null;
const SAVE='hansom_cab_save_v1';

function blank(){return {day:0,hours:0,visited:{},ev:{},flags:{},scene:null,seenEv:{},started:false,endKey:null};}
function save(){try{localStorage.setItem(SAVE,JSON.stringify(S))}catch(e){}}
function load(){try{const r=localStorage.getItem(SAVE);return r?JSON.parse(r):null}catch(e){return null}}
function hasSave(){const s=load();return s&&s.started&&!s.endKey;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function toast(title,msg){
  const t=document.createElement('div');t.className='toast';
  t.innerHTML='<b>'+esc(title)+'</b><p>'+esc(msg)+'</p>';
  document.getElementById('toasts').appendChild(t);
  setTimeout(()=>{t.style.transition='.4s';t.style.opacity=0;setTimeout(()=>t.remove(),420)},2700);
}
function addEv(id){
  if(!EV[id]||S.ev[id])return;
  S.ev[id]=1;S.seenEv[id]=0;
  toast('В дело подшито: '+EV[id].n, EV[id].d.slice(0,92)+'…');
}
function scores(){
  const sc={};Object.keys(VERS).forEach(k=>sc[k]=0);
  Object.keys(S.ev).forEach(id=>{const w=(EV[id]||{}).w||{};for(const k in w)sc[k]+=w[k];});
  return sc;
}
function pct(sc){
  const max=Math.max(6,...Object.values(sc).map(v=>Math.abs(v)));
  const o={};for(const k in sc)o[k]=Math.max(0,Math.min(100,Math.round(sc[k]/max*100)));return o;
}

/* иллюстрация: перьевой рисунок, поверх — архивное фото, если доступно */
function illus(motif,pal,cap){
  let ph='';
  if(S&&S.flags&&S.flags.photos!=='off'&&PHOTO[motif]){
    ph='<img class="ph" alt="" loading="lazy" src="'+PHOTO_URL(PHOTO[motif])+'"'+
       ' onload="this.style.opacity=.62" onerror="this.remove()">';
  }
  return '<figure class="plate"><div class="in">'+svgArt(motif,pal)+ph+
    '</div><figcaption class="cap">'+esc(cap)+'</figcaption></figure>';
}

/* ---------------- переходы ---------------- */
function go(target){
  if(target==='HUB'){S.scene=null;if(S.hours<=0)S.scene='d'+DAYS[S.day].n+'_end';}
  else if(target==='NEXTDAY'){nextDay();return;}
  else if(target==='FINALE'){S.scene='__final';}
  else S.scene=target;
  save();render();window.scrollTo({top:0,behavior:'smooth'});
}
function nextDay(){
  S.day++;
  if(S.day>=DAYS.length){S.scene='__final';save();render();window.scrollTo(0,0);return;}
  S.hours=DAYS[S.day].hours;S.visited={};S.scene=DAYS[S.day].intro;
  save();render();window.scrollTo(0,0);
}
function choose(ch){
  if(ch.need&&!S.ev[ch.need])return;
  if(ch.c)S.hours=Math.max(0,S.hours-ch.c);
  (ch.ev||[]).forEach(addEv);
  if(ch.set)for(const k in ch.set){
    const v=ch.set[k];
    S.flags[k]=(typeof v==='number'&&typeof S.flags[k]==='number')?S.flags[k]+v:v;
  }
  go(ch.go);
}
function visit(loc){
  if(S.visited[loc.id]||S.hours<=0)return;
  S.visited[loc.id]=1;S.hours--;go(loc.id);
}

/* ---------------- отрисовка ---------------- */
function render(){
  nav.style.display=(S&&S.started&&!S.endKey&&S.scene!=='__final')?'block':'none';
  if(!S||!S.started){app.innerHTML=coverScreen();bindCover();return;}
  if(S.endKey){app.innerHTML=endScreen();bindEnd();return;}
  if(S.scene==='__final'){app.innerHTML=topBar()+finaleScreen();bindFinale();return;}
  app.innerHTML=topBar()+(S.scene?sceneScreen(S.scene):hubScreen());
  bindMain();
  if(sheet)openSheet(sheet,true);
}

function bindCover(){
  const c=document.getElementById('cont'),n=document.getElementById('newg');
  if(c)c.onclick=()=>{S=load();render()};
  n.onclick=()=>{S=blank();S.started=true;S.day=0;S.hours=DAYS[0].hours;S.scene=DAYS[0].intro;save();render()};
}

/* --- язычок папки --- */
function topBar(){
  const d=DAYS[S.day];
  let t='';for(let i=0;i<d.hours;i++)t+='<i class="'+(i<S.hours?'':'gone')+'"></i>';
  return '<div class="top"><div class="tab">'+
    '<div><div class="case">Дело № 1886/14 · день '+d.n+' · '+esc(d.date)+'</div>'+
    '<div class="dayname">'+esc(d.ttl)+'</div></div>'+
    '<div class="tally" title="Осталось времени">'+t+'</div>'+
    '<div class="hrs">час.</div></div></div>';
}

/* --- план дня --- */
function hubScreen(){
  const d=DAYS[S.day];
  let h='<div class="wrap fade"><div class="paper torn"><div class="plan">'+
    '<div class="kick">План на день</div><h2>'+esc(d.ttl)+'</h2>'+
    '<p class="sub">'+esc(d.sub)+'</p></div><div class="locs">';
  d.locs.forEach(l=>{
    const v=S.visited[l.id];
    h+='<button class="loc'+(v?' spent':'')+'" data-loc="'+l.id+'"'+(v||S.hours<=0?' disabled':'')+'>'+

      '<div class="mark">'+(v?'отработано':'1 час')+'</div></button>';
  });
  h+='</div>';
  if(S.hours<=0)h+='<div style="padding:0 16px 18px"><button class="stampbtn" data-loc="__end">Время вышло</button></div>';
  h+='<div style="padding:0 20px 18px" class="mini">В папке улик: '+Object.keys(S.ev).length+' из '+Object.keys(EV).length+'</div>';
  return h+'</div></div>';
}

/* --- сцена --- */
function sceneScreen(id){
  const s=SC[id];if(!s)return '<div class="wrap"><div class="paper"><div class="body"><p>…</p></div></div></div>';
  let body='';
  s.t.forEach(p=>{
    if(typeof p==='string')body+='<p>'+esc(p)+'</p>';
    else if(p.note)body+='<p class="note">'+esc(p.note)+'</p>';
    else body+='<p class="q"><span class="who">'+esc(p.who)+'</span>'+esc(p.q)+'</p>';
  });
  let ch='';
  s.ch.forEach((c,i)=>{
    const locked=c.need&&!S.ev[c.need];
    ch+='<button class="ch'+(c.need?' ev':'')+(locked?' locked':'')+'" data-ch="'+i+'"'+(locked?' disabled':'')+'>'+
      '<span class="txt">'+esc(c.x)+'</span>'+
      (locked?'<small>Нужна улика: «'+esc(EV[c.need].n)+'»</small>':(c.sub?'<small>'+esc(c.sub)+'</small>':''))+
      (c.c?'<span class="cost">−'+c.c+' ч</span>':'')+'</button>';
  });
  return '<div class="wrap fade"><div class="sheet-card"><div class="paper torn">'+
    '<div class="hdr"><div class="where">'+esc(s.loc)+'</div><h2>'+esc(s.ttl)+'</h2>'+
    '<div class="rule"></div><div class="rule"></div></div>'+
    illus(s.motif,s.pal,s.loc)+
    '<div class="body">'+body+'</div><div class="choices">'+ch+'</div></div></div></div>';
}
function bindMain(){
  app.querySelectorAll('[data-loc]').forEach(b=>b.onclick=()=>{
    const id=b.getAttribute('data-loc');
    if(id==='__end'){go('d'+DAYS[S.day].n+'_end');return;}
    const l=DAYS[S.day].locs.find(x=>x.id===id);
    if(l&&!S.visited[id]&&S.hours>0)visit(l);
  });
  app.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{
    choose(SC[S.scene].ch[+b.getAttribute('data-ch')]);
  });
}

/* ---------------- вкладки папки ---------------- */
nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{
  const n=b.getAttribute('data-n');
  if(n==='hub'){closeSheet();render();return;}
  openSheet(n);
});
function closeSheet(){const el=document.querySelector('.sheet');if(el)el.remove();sheet=null;
  nav.querySelectorAll('button').forEach(b=>b.classList.remove('on'));}

      '<button class="stampbtn" id="restart" style="margin:0">Начать дело заново</button></div>'+
      '<div class="paper" style="padding:16px 18px"><p class="mini" style="margin:0 0 8px">Источник</p>'+
      '<p style="margin:0;font-size:15px">Фергюс Хьюм, «Тайна двухколёсного экипажа» (1886) — общественное достояние. Сюжетная канва, персонажи и развязка взяты из романа; тексты, механики, развилки и концовки написаны заново.</p></div>';
  }
  el.innerHTML=h+'</div>';
  document.body.appendChild(el);
  el.querySelector('.x').onclick=closeSheet;
  const ph=el.querySelector('#photos');
  if(ph)ph.onclick=()=>{S.flags.photos=(S.flags.photos==='off'?'on':'off');save();openSheet('menu');};
  const r=el.querySelector('#restart');
  if(r)r.onclick=()=>{if(confirm('Стереть ход следствия и начать заново?')){localStorage.removeItem(SAVE);S=blank();closeSheet();render();}};
  nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.getAttribute('data-n')===kind));
  if(!keep)save();
}

/* ---------------- финал ---------------- */
function finaleScreen(){
  const p=pct(scores());
  if(!pendingAcc){
    let h='<div class="wrap fade"><div class="sheet-card"><div class="paper torn">'+
     '<div class="hdr"><div class="where">Кабинет прокурора, пятый день</div><h2>Одна строка</h2>'+
     '<div class="rule"></div><div class="rule"></div></div>'+
     illus('court','blood','Бланк обвинительного заключения')+
     '<div class="body"><p>Прокурор придвигает бланк. Горби стоит у окна и не оборачивается. Пароход в Сидней даёт первый гудок.</p>'+
     '<p>Всё, что вы собрали за пять дней, умещается в одну строку: имя.</p>'+
     '<p class="note">Без бумаг обвинение развалится. Прокурору нужно не ваше мнение, а доказательная база.</p></div><div class="choices">';
    ACCUSE.forEach((a,i)=>{
      const have=a.need.filter(x=>S.ev[x]).length, ok=have>=a.min;
      h+='<button class="ch'+(ok?' ev':'')+'" data-acc="'+i+'"><span class="txt">'+esc(a.n)+'</span>'+
        '<small>'+esc(a.s)+(a.need.length?' · доказательная база: '+have+' из '+a.need.length:'')+'</small>'+
        '<span class="cost">'+(p[a.k]||0)+'%</span></button>';
    });
    return h+'</div></div></div></div>';
  }
  const a=pendingAcc;
  let h='<div class="wrap fade"><div class="sheet-card"><div class="paper torn">'+
    '<div class="hdr"><div class="where">Имя названо</div><h2>'+esc(a.n)+'</h2>'+
    '<div class="rule"></div><div class="rule"></div></div>'+
    '<div class="body"><p>Остаётся способ — и он решит, чем всё кончится.</p></div><div class="choices">';
  (METHODS[a.k]||[{k:'court',n:'Передать дело прокурору',s:''}]).forEach((m,i)=>{
    h+='<button class="ch" data-met="'+i+'"><span class="txt">'+esc(m.n)+'</span>'+
      (m.s?'<small>'+esc(m.s)+'</small>':'')+'</button>';});
  h+='<button class="ch" data-met="back"><span class="txt">Назвать другое имя</span></button>';
  return h+'</div></div></div></div>';
}
function bindFinale(){
  app.querySelectorAll('[data-acc]').forEach(b=>b.onclick=()=>{
    pendingAcc=ACCUSE[+b.getAttribute('data-acc')];render();window.scrollTo(0,0);});
  app.querySelectorAll('[data-met]').forEach(b=>b.onclick=()=>{
    const v=b.getAttribute('data-met');
    if(v==='back'){pendingAcc=null;render();return;}
    const m=(METHODS[pendingAcc.k]||[{k:'court'}])[+v];
    S.endKey={acc:pendingAcc.k,met:m.k};save();render();window.scrollTo(0,0);});
}

/* ---------------- развязка ---------------- */
function endScreen(){
  const e=endingFor(S.endKey.acc,S.endKey.met), truth=S.endKey.acc==='M';
  const stamp=e.ok?'Дело закрыто':(S.endKey.acc==='K'?'Дело приостановлено':'Дело закрыто');
  return '<div class="wrap fade"><div class="sheet-card"><div class="paper torn">'+
    illus(e.motif,e.pal,'Развязка')+
    '<div class="verdict"><div class="band">'+esc(e.r)+'</div><h1>'+esc(e.t)+'</h1>'+
    '<div class="bigstamp'+(e.ok?'':' grey')+'">'+stamp+'</div>'+
    '<div class="txt">'+e.p.map(x=>'<p>'+esc(x)+'</p>').join('')+'</div>'+
    '<div class="ledger">'+
      row('Улик подшито',Object.keys(S.ev).length+' из '+Object.keys(EV).length)+
      row('Настоящий убийца',truth?'назван верно':'остался на свободе')+
      row('Невиновный',(S.endKey.acc!=='B'&&S.endKey.acc!=='S')?'спасён':'осуждён')+
      row('Метод работы',S.flags.harsh?'жёсткий':'корректный')+
      row('Брачное свидетельство',{public:'обнародовано',burn:'сожжено',settle:'содержание для Сэл'}[S.flags.paper]||'осталось в архиве')+
    '</div>'+
    '<p class="afterword">У Хьюма убийцей оказывается Роджер Морланд: он усыпил пьяного Уайта хлороформом, чтобы забрать брачное свидетельство и шантажировать Фретлби уже самому, и не рассчитал дозу. Признание Марка Фретлби — ложь умирающего отца, спасающего дочь от позора. Читателям 1886 года это не давалось до последней главы.</p>'+
    '<button class="stampbtn" id="again" style="margin-top:20px">Открыть дело заново</button>'+
    '</div></div></div></div>';
}
function row(a,b){return '<div><span>'+esc(a)+'</span><span>'+esc(b)+'</span></div>';}
function bindEnd(){document.getElementById('again').onclick=()=>{
  localStorage.removeItem(SAVE);S=blank();pendingAcc=null;render();window.scrollTo(0,0);};}

/* ---------------- старт ---------------- */
S=load()||blank();
if(S.started&&S.endKey)S=blank();
render();

</script>
</body>
</html>
